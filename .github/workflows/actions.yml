name: Java CI

on:
  push:
    branches: [ develop, 'support/4.x' ]
  pull_request:
    branches: [ develop, 'support/4.x' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Cache Maven
      uses: actions/cache@v4
      with:
        path: |
          ~/.m2
          ~/downloads
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-m2-

    - name: Configure Maven
      run: |
        mkdir -p $HOME/.m2
        cp .travis-settings.xml $HOME/.m2/settings.xml

    - name: Build and deploy
      if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
      run: mvn -Dmaven.javadoc.skip=true clean deploy -DcloneUi=true --settings .travis-settings.xml

    - name: Build and install
      if: github.event_name == 'push' && github.ref == 'refs/heads/support/4.x'
      run: mvn -Dmaven.javadoc.skip=true clean deploy -DcloneUi=true --settings .travis-settings.xml

    - name: Build and install PR
      if: github.event_name == 'pull_request'
      run: mvn -Dmaven.javadoc.skip=true clean install -DcloneUi=true